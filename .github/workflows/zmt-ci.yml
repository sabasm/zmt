name: ZMT Audit (Zero-Miss-Tap)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  zmt-audit:
    name: ZMT Accessibility & Ergonomics Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ZMT CLI (tapguard-cli)
        run: |
          # Placeholder: tapguard-cli does not exist yet
          # This will be replaced with actual package when available
          # npm install -g tapguard-cli
          
          # For now, create a mock CLI that simulates the audit
          mkdir -p /tmp/zmt-tools
          cat > /tmp/zmt-tools/tapguard << 'EOF'
          #!/bin/bash
          # Mock tapguard CLI for demonstration
          # Real implementation will scan codebase for ZMT violations
          
          echo "🔍 Running ZMT Audit..."
          echo "📊 Scanning surfaces: phone, tablet, desktop, watch, glasses_microdisplay, tv, ar_vr"
          
          # Generate mock report
          cat > zmt-report.json << 'REPORT'
          {
            "sot_version": "1.0.0",
            "audit_timestamp": "2025-10-03T00:00:00Z",
            "surfaces": {
              "phone": {
                "tap_safety_score": 95,
                "miss_tap_rate": 0.015,
                "violations": {
                  "blocker": 0,
                  "alta": 0,
                  "media": 2,
                  "baja": 1
                },
                "runtime_overhead_p95_ms": 8
              },
              "tablet": {
                "tap_safety_score": 92,
                "miss_tap_rate": 0.018,
                "violations": {
                  "blocker": 0,
                  "alta": 0,
                  "media": 1,
                  "baja": 0
                },
                "runtime_overhead_p95_ms": 9
              },
              "desktop": {
                "tap_safety_score": 88,
                "miss_tap_rate": 0.008,
                "violations": {
                  "blocker": 0,
                  "alta": 0,
                  "media": 0,
                  "baja": 1
                },
                "runtime_overhead_p95_ms": 7
              },
              "watch": {
                "tap_safety_score": 86,
                "miss_tap_rate": 0.025,
                "violations": {
                  "blocker": 0,
                  "alta": 0,
                  "media": 1,
                  "baja": 0
                },
                "runtime_overhead_p95_ms": 6
              },
              "glasses_microdisplay": {
                "tap_safety_score": 82,
                "miss_tap_rate": 0.019,
                "violations": {
                  "blocker": 0,
                  "alta": 0,
                  "media": 0,
                  "baja": 2
                },
                "runtime_overhead_p95_ms": 5
              },
              "tv": {
                "tap_safety_score": 87,
                "miss_tap_rate": 0.009,
                "violations": {
                  "blocker": 0,
                  "alta": 0,
                  "media": 1,
                  "baja": 0
                },
                "runtime_overhead_p95_ms": 6
              },
              "ar_vr": {
                "tap_safety_score": 81,
                "miss_tap_rate": 0.020,
                "violations": {
                  "blocker": 0,
                  "alta": 0,
                  "media": 0,
                  "baja": 1
                },
                "runtime_overhead_p95_ms": 7
              }
            },
            "overall": {
              "tap_safety_score": 87,
              "miss_tap_rate": 0.016,
              "total_violations": {
                "blocker": 0,
                "alta": 0,
                "media": 5,
                "baja": 5
              }
            }
          }
          REPORT
          
          echo "✅ ZMT Audit complete. Report saved to zmt-report.json"
          EOF
          
          chmod +x /tmp/zmt-tools/tapguard
          sudo ln -sf /tmp/zmt-tools/tapguard /usr/local/bin/tapguard

      - name: Install jq (JSON processor)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run ZMT Audit (All Surfaces)
        run: |
          tapguard audit --surfaces=all --report=zmt-report.json || true
          echo "📄 ZMT Report Generated"
          cat zmt-report.json

      - name: Enforce Gates - Phone
        run: |
          echo "🔒 Enforcing ZMT Gates for Phone..."
          
          TSS=$(jq -r '.surfaces.phone.tap_safety_score' zmt-report.json)
          MTR=$(jq -r '.surfaces.phone.miss_tap_rate' zmt-report.json)
          BLOCKER=$(jq -r '.surfaces.phone.violations.blocker' zmt-report.json)
          ALTA=$(jq -r '.surfaces.phone.violations.alta' zmt-report.json)
          OVERHEAD=$(jq -r '.surfaces.phone.runtime_overhead_p95_ms' zmt-report.json)
          
          echo "  Tap Safety Score: $TSS (min: 90)"
          echo "  Miss-Tap Rate: $MTR (max: 0.02)"
          echo "  Blocker Violations: $BLOCKER (max: 0)"
          echo "  Alta Violations: $ALTA (max: 0)"
          echo "  Runtime Overhead p95: ${OVERHEAD}ms (max: 10ms)"
          
          FAIL=0
          if (( $(echo "$TSS < 90" | bc -l) )); then
            echo "❌ FAIL: Tap Safety Score below threshold (90)"
            FAIL=1
          fi
          if (( $(echo "$MTR > 0.02" | bc -l) )); then
            echo "❌ FAIL: Miss-Tap Rate above threshold (0.02)"
            FAIL=1
          fi
          if [ "$BLOCKER" != "0" ]; then
            echo "❌ FAIL: Blocker violations detected"
            FAIL=1
          fi
          if [ "$ALTA" != "0" ]; then
            echo "❌ FAIL: Alta (High) violations detected"
            FAIL=1
          fi
          if (( $(echo "$OVERHEAD > 10" | bc -l) )); then
            echo "❌ FAIL: Runtime overhead exceeds budget (10ms)"
            FAIL=1
          fi
          
          if [ $FAIL -eq 1 ]; then
            exit 1
          fi
          echo "✅ Phone gates passed"

